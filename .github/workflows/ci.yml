name: PRM CI
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'infra/**', cadastro-api-arquivos]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q app scripts docker
      - run: python -c "import app.main"
      - run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile workers config --quiet
      - run: docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - run: docker build -t prm:local .
      - run: docker run --rm --network none prm:local python -m pytest -q
      - run: docker compose up -d --wait db
      - run: docker compose run --rm migrate
      - run: docker compose up -d --wait gateway worker-registration worker-datasheets worker-alerts
      # Removal worker is an uncommitted functional dependency: not silently staged by infra.
      - name: Removal worker when delivered by functional PR
        run: |
          if test -f scripts/store_removal_worker.py; then
            docker compose up -d --wait worker-removal
          else
            echo '::warning::Removal worker pending functional PR; other workers tested.'
          fi
      - run: curl --fail http://127.0.0.1:8001/api/v1/health/ready
      - run: docker compose exec -T api python docker/persistence_smoke.py write
      - run: docker compose up -d --force-recreate --wait gateway db api worker-registration worker-datasheets worker-alerts
      - run: docker compose exec -T api python docker/persistence_smoke.py verify
      - if: always()
        run: docker compose --profile workers logs --tail 60
      - if: always()
        run: docker compose --profile workers down
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning (no license or repository secrets required)
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0 git --source=/repo --redact --exit-code=1
