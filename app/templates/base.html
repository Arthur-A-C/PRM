<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ title }} · PRM</title>
  <script>try{var t=localStorage.getItem('prm-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/favicon.svg') }}">

  <link
    rel="stylesheet"
    href="{{ url_for('static', path='/css/app.css') }}"
  >

  {% block extra_head %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', path='/brand/brand.css') }}?v=20261015-2">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/brand-logos.css') }}?v=20261015-2">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/design-system.css') }}?v=20261008-1">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/prm-v2.css') }}?v=20261014-2">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/prm-dark.css') }}?v=20261009-4">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/workspace.css') }}?v=20261015-cc2">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/command-center.css') }}?v=20261015-cc4">
</head>

<body>
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
  {% block body %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
